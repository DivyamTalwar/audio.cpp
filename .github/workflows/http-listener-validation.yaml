name: HTTP listener high-descriptor validation
on:
  push:
    branches: [audit/http-listener-20260922]
    paths: [audit/http-listener.py, .github/workflows/http-listener-validation.yaml]
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          path: audit-control
          persist-credentials: false
      - uses: actions/checkout@v6.0.2
        with:
          ref: 779714db0872cc7351d69baeaafb8bd5cf47fac7
          path: work
          persist-credentials: false
      - name: Add independent public-listener regression without changing body tests
        working-directory: work
        run: python3 ../audit-control/audit/http-listener.py test-only
      - name: Configure and build the actual CMake target with ASan and UBSan
        working-directory: work
        run: |
          cmake -S . -B build/http-audit -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO='-O1 -g' \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO='-O1 -g' \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DBUILD_SHARED_LIBS=OFF -DENGINE_BUILD_TESTS=ON -DENGINE_BUILD_EXTENDED_TESTS=ON \
            -DAUDIOCPP_MODEL_SET=core \
            -DENGINE_ENABLE_NATIVE_CPU=OFF -DENGINE_ENABLE_METAL=OFF \
            -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_VULKAN=OFF \
            > /tmp/audio-configure.log 2>&1 || { tail -100 /tmp/audio-configure.log; exit 1; }
          cmake --build build/http-audit --target http_listener_test -j 4 \
            > /tmp/audio-build-before.log 2>&1 || { tail -100 /tmp/audio-build-before.log; exit 1; }
      - name: Confirm ordinary listener works and high-descriptor baseline violates FD_SET bounds
        working-directory: work
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          timeout 30 build/http-audit/bin/http_listener_test > /tmp/audio-normal-before.log 2>&1 || { cat /tmp/audio-normal-before.log; exit 1; }
          cat /tmp/audio-normal-before.log
          set +e
          timeout 30 build/http-audit/bin/http_listener_test --high-fd > /tmp/audio-high-before.log 2>&1
          code=$?
          set -e
          cat /tmp/audio-high-before.log
          test "$code" -ne 0
          test "$code" -ne 77
          test "$code" -ne 124
          # Fortified libc can detect this before ASan/UBSan intercept a write.
          # Accept only that precise FD_SET diagnostic or a symbolized sanitizer
          # report from wait_for_client; never accept a generic test failure.
          if grep -q 'bit out of range 0 - FD_SETSIZE on fd_set' /tmp/audio-high-before.log; then
            echo 'Negative control: libc fortify caught the FD_SET bounds violation'
          else
            grep -Eq 'stack-buffer-overflow|out of bounds' /tmp/audio-high-before.log
            grep -q 'wait_for_client' /tmp/audio-high-before.log
          fi
      - name: Apply the listener fix and rebuild the same target
        working-directory: work
        run: |
          python3 ../audit-control/audit/http-listener.py fix
          cmake --build build/http-audit --target http_listener_test -j 4 \
            > /tmp/audio-build-after.log 2>&1 || { tail -100 /tmp/audio-build-after.log; exit 1; }
      - name: Repeat normal and high-descriptor runtime checks under sanitizers
        working-directory: work
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build/http-audit -R '^(http_listener_test|http_listener_high_fd_test)$' \
            --repeat until-fail:3 --output-on-failure > /tmp/audio-after.log 2>&1 || { cat /tmp/audio-after.log; exit 1; }
          cat /tmp/audio-after.log
          ! grep -E 'Skipped|Not Run' /tmp/audio-after.log
          git diff --exit-code -- tests/unittests/test_http_live_body.cpp
          git diff --check
      - name: Publish only the validated source new test and CMake changes
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'Divyam Talwar'
          git config user.email '194859478+DivyamTalwar@users.noreply.github.com'
          git checkout -b fix/http-listener-high-file-descriptors
          git add app/server/http.cpp tests/unittests/test_http_listener.cpp CMakeLists.txt
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(server): poll POSIX listeners without FD_SETSIZE bounds'
          git push origin HEAD:refs/heads/fix/http-listener-high-file-descriptors
          git rev-parse HEAD
      - name: Preserve exact build and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: http-listener-validation-evidence
          path: /tmp/audio-*.log
          retention-days: 7

name: Isolated native parser and output validation
on:
  push:
    branches: [audit/next30-audio-test-cases-20260924]
permissions:
  contents: read
jobs:
  runtime:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: cli-batch-output-names
            ref: 27199fee4f1005215a6f391f1231be3336ccab7e
            base: 9bdd1d908bbd128e9eb405f5a8e38d0defb84c72
            targets: cli_batch_output_names_test cli_request_options_test file_sink_json_test
            test_regex: ^(cli_batch_output_names|cli_request_options|file_sink_json)_test$
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure real repository CMake targets with ASan and UBSan
        run: |
          set -euo pipefail
          mkdir -p /tmp/audio-final-gate
          git rev-parse HEAD | tee /tmp/audio-final-gate/commit.txt
          git diff "${{ matrix.base }}...HEAD" --check
          cmake -S . -B build/native-audit -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO='-O1 -g' \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO='-O1 -g' \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DBUILD_SHARED_LIBS=OFF -DENGINE_BUILD_TESTS=ON -DENGINE_BUILD_EXTENDED_TESTS=ON \
            -DAUDIOCPP_MODEL_SET=core -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DENGINE_ENABLE_METAL=OFF -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_VULKAN=OFF \
            > /tmp/audio-final-gate/configure.log 2>&1 || { tail -100 /tmp/audio-final-gate/configure.log; exit 1; }
      - name: Build and repeatedly execute the exact prepared patch
        env:
          TARGETS: ${{ matrix.targets }}
          TEST_REGEX: ${{ matrix.test_regex }}
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cmake --build build/native-audit --target $TARGETS -j 4 \
            > /tmp/audio-final-gate/build.log 2>&1 || { tail -100 /tmp/audio-final-gate/build.log; exit 1; }
          ctest --test-dir build/native-audit -R "$TEST_REGEX" --repeat until-fail:3 --output-on-failure \
            > /tmp/audio-final-gate/patched.log 2>&1 || { cat /tmp/audio-final-gate/patched.log; exit 1; }
          cat /tmp/audio-final-gate/patched.log
          ! grep -E 'Skipped|Not Run|No tests were found' /tmp/audio-final-gate/patched.log
      - name: Verify regression against unchanged batch source
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cp app/cli/batch.cpp /tmp/audio-final-gate/batch-patched.cpp
          trap 'cp /tmp/audio-final-gate/batch-patched.cpp app/cli/batch.cpp' EXIT
          git show "${{ matrix.base }}:app/cli/batch.cpp" > app/cli/batch.cpp
          cmake --build build/native-audit --target cli_batch_output_names_test -j 4 > /tmp/audio-final-gate/baseline-build.log 2>&1
          set +e
          build/native-audit/cli_batch_output_names_test > /tmp/audio-final-gate/baseline-test.log 2>&1
          status=$?
          set -e
          cat /tmp/audio-final-gate/baseline-test.log
          test "$status" -eq 1
          grep -F '6 passed, 5 failed' /tmp/audio-final-gate/baseline-test.log
          grep -F 'colliding batch output names were accepted' /tmp/audio-final-gate/baseline-test.log
          cp /tmp/audio-final-gate/batch-patched.cpp app/cli/batch.cpp
          git diff --exit-code
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: audio-final-${{ matrix.label }}
          path: /tmp/audio-final-gate/
          retention-days: 7

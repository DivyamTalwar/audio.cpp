name: Workflow correctness candidate validation
on:
  push:
    branches: [audit/audio-workflow-followups-20260924]
permissions:
  contents: read
jobs:
  runtime:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: a02-input-resolution
            ref: c5632e545841d285b0ad3ad7d107471ab4530418
            target: workflow_input_resolution_test
            expected: "FAIL test_reference_cycles_are_rejected"
          - label: a03-named-audio-path
            ref: 1569cd6e44115fa3e6febf2ff94ca4e04fcde3c9
            target: workflow_named_audio_paths_test
            expected: "2 passed, 3 failed"
          - label: a04-chunked-item-files
            ref: bc16f1fa27fc68a50f7152fa08d905425caa2a6b
            target: workflow_chunked_foreach_paths_test
            expected: "missing expected file"
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure real CMake targets
        run: |
          set -euo pipefail
          mkdir -p /tmp/workflow-gate
          git rev-parse HEAD | tee /tmp/workflow-gate/commit.txt
          git diff 9bdd1d908bbd128e9eb405f5a8e38d0defb84c72...HEAD --check
          cmake -S . -B build/workflow-gate -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO='-O1 -g' \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO='-O1 -g' \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DBUILD_SHARED_LIBS=OFF -DENGINE_BUILD_TESTS=ON -DENGINE_BUILD_EXTENDED_TESTS=ON \
            -DAUDIOCPP_MODEL_SET=core -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DENGINE_ENABLE_METAL=OFF -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_VULKAN=OFF \
            > /tmp/workflow-gate/configure.log 2>&1 || { tail -80 /tmp/workflow-gate/configure.log; exit 1; }
      - name: Execute baseline then corrected workflow and neighbor targets
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED: ${{ matrix.expected }}
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 - <<'CHECK'
          import json, os, re, subprocess
          from pathlib import Path
          out=Path('/tmp/workflow-gate'); build='build/workflow-gate'; target=os.environ['TARGET']
          source=Path('app/workflow/workflow.cpp'); prepared=source.read_bytes(); commands=[]
          def execute(label,cmd,timeout=900):
              commands.append({'label':label,'command':cmd}); (out/'commands.json').write_text(json.dumps(commands,indent=2))
              with (out/(label+'.log')).open('w') as log:
                  result=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=timeout)
              text=(out/(label+'.log')).read_text(); print(label,'exit',result.returncode,flush=True)
              if result.returncode:print(text[-10000:])
              return result.returncode,text
          try:
              source.write_bytes(subprocess.check_output(['git','show','9bdd1d908bbd128e9eb405f5a8e38d0defb84c72:app/workflow/workflow.cpp']))
              code,_=execute('baseline-build',['cmake','--build',build,'--target',target,'-j','4']); assert code==0,'baseline test did not build'
              registration=json.loads(subprocess.check_output(['ctest','--test-dir',build,'--show-only=json-v1','-R','^'+target+'$'],text=True))
              assert len(registration['tests'])==1
              command=registration['tests'][0]['command']
              code,text=execute('baseline-test',command,90)
              assert code==1,'expected assertion failure, not crash or launch error'
              assert os.environ['EXPECTED'] in text, 'expected regression diagnostic is missing'
          finally:
              source.write_bytes(prepared)
          code,_=execute('patched-build',['cmake','--build',build,'--target',target,'cli_request_options_test','file_sink_json_test','-j','4']);assert code==0
          pattern='^('+target+'|cli_request_options_test|file_sink_json_test)$'
          code,text=execute('patched-tests',['ctest','--test-dir',build,'-R',pattern,'--repeat','until-fail:3','--timeout','90','--output-on-failure'],300)
          print(text); assert code==0
          assert not re.search(r'Skipped|Not Run|No tests were found',text)
          subprocess.run(['git','diff','--exit-code'],check=True)
          (out/'result.json').write_text(json.dumps({'target':target,'baseline_regression_verified':True,'patched_ctest_success':True,'repeat':3,'targets':[target,'cli_request_options_test','file_sink_json_test'],'commit':(out/'commit.txt').read_text().strip()},indent=2))
          CHECK
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: workflow-${{ matrix.label }}
          path: /tmp/workflow-gate/
          retention-days: 7

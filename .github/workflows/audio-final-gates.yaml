name: Isolated native parser and output validation
on:
  push:
    branches: [audit/finish-audio-25-20260922]
permissions:
  contents: read
jobs:
  runtime:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: multipart-delimiter-lines
            ref: 227d71ef5fa471f6432c7867bf9cfc95410661d5
            targets: server_multipart_test server_multipart_http_test
            test_regex: ^server_multipart(_http)?_test$
            regression_target: server_multipart_test
            production_file: app/server/multipart.cpp
            diagnostic: inline boundary-looking bytes must not create extra parts
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure real repository CMake targets with ASan and UBSan
        run: |
          set -euo pipefail
          mkdir -p /tmp/audio-final-gate
          git rev-parse HEAD | tee /tmp/audio-final-gate/commit.txt
          git diff 779714db0872cc7351d69baeaafb8bd5cf47fac7...HEAD --check
          cmake -S . -B build/native-audit -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO='-O1 -g' \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO='-O1 -g' \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DBUILD_SHARED_LIBS=OFF -DENGINE_BUILD_TESTS=ON -DENGINE_BUILD_EXTENDED_TESTS=ON \
            -DAUDIOCPP_MODEL_SET=core -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DENGINE_ENABLE_METAL=OFF -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_VULKAN=OFF \
            > /tmp/audio-final-gate/configure.log 2>&1 || { tail -100 /tmp/audio-final-gate/configure.log; exit 1; }
      - name: Build and repeatedly execute the exact prepared patch
        env:
          TARGETS: ${{ matrix.targets }}
          TEST_REGEX: ${{ matrix.test_regex }}
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cmake --build build/native-audit --target $TARGETS -j 4 \
            > /tmp/audio-final-gate/build.log 2>&1 || { tail -100 /tmp/audio-final-gate/build.log; exit 1; }
          ctest --test-dir build/native-audit -R "$TEST_REGEX" --repeat until-fail:3 --output-on-failure \
            > /tmp/audio-final-gate/patched.log 2>&1 || { cat /tmp/audio-final-gate/patched.log; exit 1; }
          cat /tmp/audio-final-gate/patched.log
          ! grep -E 'Skipped|Not Run|No tests were found' /tmp/audio-final-gate/patched.log
      - name: Prove the regression against unchanged production source
        env:
          PRODUCTION_FILE: ${{ matrix.production_file }}
          REGRESSION_TARGET: ${{ matrix.regression_target }}
          DIAGNOSTIC: ${{ matrix.diagnostic }}
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cp "$PRODUCTION_FILE" /tmp/audio-final-gate/patched-source.cpp
          git show "779714db0872cc7351d69baeaafb8bd5cf47fac7:$PRODUCTION_FILE" > "$PRODUCTION_FILE"
          cmake --build build/native-audit --target "$REGRESSION_TARGET" -j 4 \
            > /tmp/audio-final-gate/baseline-build.log 2>&1 || { tail -100 /tmp/audio-final-gate/baseline-build.log; exit 1; }
          set +e
          timeout 30 "build/native-audit/bin/$REGRESSION_TARGET" > /tmp/audio-final-gate/baseline.log 2>&1
          code=$?
          set -e
          cat /tmp/audio-final-gate/baseline.log
          test "$code" -eq 1
          grep -F "$DIAGNOSTIC" /tmp/audio-final-gate/baseline.log
          cp /tmp/audio-final-gate/patched-source.cpp "$PRODUCTION_FILE"
          git diff --exit-code
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: audio-final-${{ matrix.label }}
          path: /tmp/audio-final-gate/
          retention-days: 7
